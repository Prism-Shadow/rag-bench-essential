schema_version: 1
case_id: medagentbench_potassium_repletion_order_hard
scoring:
  max_score: 10
  hard_pass_requires:
    - SP001
    - SP002
    - SP003
points:
  - id: SP001
    dimension: D4_delivery
    goal: Deliver actions.json and report.md.
    weight: 1
    judge: rule
    hard_gate: true
    failure_layers:
      - completion_contract
      - delivery_path
    checks:
      - type: required_outputs_present
      - type: json_parse
        path: actions.json
  - id: SP002
    dimension: D1_answer
    goal: Produce clinically consistent potassium queries, low flags, replacement orders, doses, and follow-up labs.
    weight: 7
    judge: rule
    hard_gate: true
    failure_layers:
      - program_semantics
      - calculation
      - evidence_binding
    checks:
      - type: medagent_actions
  - id: SP003
    dimension: D4_delivery
    goal: Include a non-trivial report describing the potassium/FHIR action trail.
    weight: 2
    judge: rule
    hard_gate: true
    failure_layers:
      - completion_contract
      - evidence_binding
    checks:
      - type: medagent_report
      - type: validator_exit
        expected: 0
