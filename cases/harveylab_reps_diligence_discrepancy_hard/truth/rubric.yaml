schema_version: 1
case_id: harveylab_reps_diligence_discrepancy_hard
scoring:
  max_score: 10
  hard_pass_requires:
    - SP001
    - SP002
    - SP003
    - SP004
points:
  - id: SP001
    dimension: D4_delivery
    goal: Deliver a readable, non-trivial DOCX memo with the required filename.
    weight: 1
    judge: rule
    hard_gate: true
    failure_layers:
      - completion_contract
      - delivery_path
    checks:
      - type: harvey_docx_delivery
  - id: SP002
    dimension: D1_answer
    goal: Cover the required number of diligence-versus-representation discrepancy issues.
    weight: 5
    judge: rule
    hard_gate: true
    failure_layers:
      - retrieval_miss
      - program_semantics
    checks:
      - type: harvey_issue_coverage
  - id: SP003
    dimension: D2_evidence_binding
    goal: Bind findings to recognizable source files and sections.
    weight: 2
    judge: rule
    hard_gate: true
    failure_layers:
      - evidence_binding
    checks:
      - type: harvey_source_binding
  - id: SP004
    dimension: D3_key_intermediate
    goal: Include practical severity and recommendation controls in the memo.
    weight: 2
    judge: rule
    hard_gate: true
    failure_layers:
      - program_semantics
      - completion_contract
    checks:
      - type: harvey_memo_controls
