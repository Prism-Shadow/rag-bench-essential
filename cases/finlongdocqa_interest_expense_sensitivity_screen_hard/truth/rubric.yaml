schema_version: 1
case_id: finlongdocqa_interest_expense_sensitivity_screen_hard
scoring:
  max_score: 10
  hard_pass_requires:
    - SP001
    - SP002
    - SP003
    - SP004
points:
  - id: SP001
    dimension: D4_delivery
    goal: Submit parseable answers.json with the requested screen structure.
    weight: 1
    judge: rule
    hard_gate: true
    failure_layers:
      - completion_contract
      - delivery_path
    checks:
      - type: file_exists
        path: answers.json
      - type: json_parse
        path: answers.json
  - id: SP002
    dimension: D3_key_intermediate
    goal: Identify the eligible and excluded ticker universe.
    weight: 2
    judge: rule
    hard_gate: true
    failure_layers:
      - retrieval_miss
      - program_semantics
    checks:
      - type: finlong_universe
  - id: SP003
    dimension: D1_answer
    goal: Rank tickers and report top, bottom, and spread per $1B variable-rate debt.
    weight: 3
    judge: rule
    hard_gate: true
    failure_layers:
      - calculation
      - program_semantics
    checks:
      - type: finlong_ranking
  - id: SP004
    dimension: D3_key_intermediate
    goal: Report rate shocks, standardized impacts, variable-rate debt, and per-$1B ratios.
    weight: 4
    judge: rule
    hard_gate: true
    failure_layers:
      - calculation
      - evidence_binding
    checks:
      - type: finlong_figures
      - type: validator_exit
        expected: 0
