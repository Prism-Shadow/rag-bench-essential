schema_version: 1
case_id: spider2lite_f1_overtake_audit_hard
scoring:
  max_score: 10
  hard_pass_requires:
    - SP001
    - SP002
    - SP003
points:
  - id: SP001
    dimension: D4_delivery
    goal: Deliver the three CSV outputs, evidence.json, and report.md.
    weight: 1
    judge: rule
    hard_gate: true
    failure_layers:
      - completion_contract
      - delivery_path
    checks:
      - type: required_outputs_present
      - type: json_parse
        path: evidence.json
      - type: file_exists
        path: report.md
  - id: SP002
    dimension: D1_answer
    goal: Match all three official overtake output files against clean-engine gold variants.
    weight: 5
    judge: rule
    hard_gate: true
    failure_layers:
      - calculation
      - program_semantics
    checks:
      - type: spider_part_outputs
  - id: SP003
    dimension: D2_evidence_binding
    goal: Bind event construction, tables, taxonomy, priority, direction, and exclusions in evidence.json.
    weight: 4
    judge: rule
    hard_gate: true
    failure_layers:
      - evidence_binding
      - program_semantics
    checks:
      - type: spider_evidence
      - type: validator_exit
        expected: 0
