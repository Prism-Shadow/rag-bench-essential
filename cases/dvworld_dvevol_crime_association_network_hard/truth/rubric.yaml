schema_version: 1
case_id: dvworld_dvevol_crime_association_network_hard
scoring:
  max_score: 9
  hard_pass_requires:
    - SP001
    - SP002
    - SP003
    - SP004
points:
  - id: SP001
    dimension: D4_delivery
    goal: Deliver every required artifact named by the public task.
    weight: 1
    judge: rule
    hard_gate: true
    failure_layers:
      - completion_contract
      - delivery_path
    checks:
      - type: required_outputs_present
  - id: SP002
    dimension: D3_key_intermediate
    goal: Report the required metadata, threshold, node order, and chart summary in answers.json.
    weight: 2
    judge: rule
    hard_gate: true
    failure_layers:
      - program_semantics
      - calculation
    checks:
      - type: json_parse
        path: answers.json
      - type: dvworld_answers
  - id: SP003
    dimension: D1_answer
    goal: Produce the complete derived edge table with correct correlations, signs, bins, colors, and widths.
    weight: 4
    judge: rule
    hard_gate: true
    failure_layers:
      - calculation
      - program_semantics
    checks:
      - type: dvworld_edges
  - id: SP004
    dimension: D4_delivery
    goal: Produce a chart spec bound to derived_edges.csv and a valid PNG figure.
    weight: 2
    judge: rule
    hard_gate: true
    failure_layers:
      - completion_contract
      - evidence_binding
    checks:
      - type: json_parse
        path: chart_spec.json
      - type: dvworld_chart_spec
      - type: png_valid
        path: figure.png
